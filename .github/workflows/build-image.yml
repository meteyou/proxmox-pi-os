name: "Build Image (reusable)"

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or SHA)"
        type: string
        required: false
        default: ""
      upload_to_release:
        description: "Upload the build results to the GitHub release matching the VERSION file"
        type: boolean
        required: false
        default: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: "🛠 Generate matrix from config.yml"
        id: create-matrix
        shell: python
        run: |
          import os, yaml, json
          with open("config.yml", "r") as f:
              config = yaml.safe_load(f)
          matrix = {"include": config}
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              print(f"matrix={json.dumps(matrix)}", file=fh)

  build:
    needs: generate-matrix
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: "#️⃣️ Set RELEASE_TAG from VERSION file"
        run: |
          RELEASE_TAG=$(cat VERSION | tr -d '\n')
          DATE="$(date +"%Y-%m-%d")"

          echo "DATE=${DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: "📁 Create directories"
        run: |
          mkdir -p build
          mkdir -p scripts

      - name: "⬇ Download Image via Torrent"
        if: ${{ endsWith(matrix.img_download_url, '.torrent') }}
        run: aria2c -d build --seed-time=0 --enable-dht=false "${{ matrix.img_download_url }}"

      - name: "⬇ Download Image via wget"
        if: ${{ !endsWith(matrix.img_download_url, '.torrent') }}
        working-directory: ./build
        run: wget --trust-server-names ${{ matrix.img_download_url }}

      - name: "🔐 Verify image"
        working-directory: ./build
        run: curl -Ls ${{  matrix.img_hash_url }} | sha256sum -c

      - name: "🛠 Unpack and rename image"
        working-directory: ./build
        run: |
          # search for the image file in the build directory
          IMG_FILE=$(ls *.img.xz | head -n 1)
          echo "Found compressed Image file: ${IMG_FILE}"

          # extract the image file
          xz -d "${IMG_FILE}"

          DECOMPRESSED_FILE="${IMG_FILE%.xz}"
          echo "Image file: ${DECOMPRESSED_FILE}"

          # rename the image file
          mv "${DECOMPRESSED_FILE}" input.img

      - name: "📋 Copy generic and type scripts"
        run: |
          cp -r modules/generic/* scripts/
          cp -r modules/${{ matrix.type }}/* scripts/
          for file in scripts/*.disabled; do
            if [ -e "$file" ]; then
              rm "$file"
            fi
          done

      - name: "📋 Copy special modules"
        if: matrix.special_modules && toJson(matrix.special_modules) != '[]'
        run: |
          echo "Special modules found for ${{ matrix.name }}: ${{ toJson(matrix.special_modules) }}"

          # copy additional files for special modules
          if [ -d "modules/special/files" ]; then
            echo "Copying common special files..."
            cp -r modules/special/files/* scripts/files/
          fi

          # Convert JSON array to bash array
          readarray -t MODULES < <(echo '${{ toJson(matrix.special_modules) }}' | jq -r '.[]')

          for module in "${MODULES[@]}"; do
            echo "Copying module: ${module}"
            cp "modules/special/${module}" scripts/
          done

      - name: "📇 Generate config.local"
        shell: python
        run: |
          print("Generating config.local file...")
          import os, json
          env_vars = json.loads(os.environ.get("MATRIX_ENV", "{}"))
          with open("config.local", "w") as f:
              for key, value in env_vars.items():
                  if not key.startswith("EDITBASE_"):
                      key = "EDITBASE_" + key
                  f.write(f"{key}={value}\n")
        env:
          MATRIX_ENV: ${{ toJson(matrix.env) }}

      - name: "🔎 Show scripts"
        working-directory: ./scripts
        run: ls -la

      - name: "🏗 Run CustoPiZer"
        uses: OctoPrint/CustoPiZer@main
        with:
          workspace: "${{ github.workspace }}/build"
          scripts:  "${{ github.workspace }}/scripts"
          config: "${{ github.workspace }}/config.local"
          environment: '{ "RELEASE_TAG": "${{ env.RELEASE_TAG }}"}'
          custopizer: "main"

      - name: "✏ Rename image"
        working-directory: ./build
        run: |
          IMAGE="${{ env.DATE }}-ProxmoxOS-${{ matrix.name }}-${{ env.RELEASE_TAG }}.img"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          mv output.img "${IMAGE}"

      - name: "🛠 Compressing Image"
        working-directory: ./build
        run: |
          CPU_COUNT="$(nproc)"
          echo -e "\e[32mUsing ${CPU_COUNT} Cores for compression...\e[0m"
          xz -efkvz9T"${CPU_COUNT}" ${{ env.IMAGE }} || true

      - name: "🔐 Create hash"
        working-directory: ./build
        run: |
          sha256sum ${{ env.IMAGE }} > ${{ env.IMAGE }}.sha256
          sha256sum ${{ env.IMAGE }}.xz > ${{ env.IMAGE }}.xz.sha256

      - name: "📝 Generate Raspberry Pi Imager manifest"
        working-directory: ./build
        shell: python
        run: |
          import os, json, datetime

          image = os.environ["IMAGE"]
          rpi_json = json.loads(os.environ.get("RPI_JSON") or "{}")
          env_vars = json.loads(os.environ.get("MATRIX_ENV") or "{}")
          release_tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_from(path):
              with open(path) as f:
                  return f.read().split()[0]

          entry = {
              "name": rpi_json.get("name", image).replace("$VERSION$", release_tag),
              "description": rpi_json.get("description", ""),
              "icon": rpi_json.get("icon", "https://downloads.raspberrypi.com/imager/images/raspberrypi.png"),
              # Replace with file:///path/to/<image>.xz to use a locally downloaded copy
              "url": f"https://github.com/{repo}/releases/download/{release_tag}/{image}.xz",
              "extract_size": os.path.getsize(image),
              "extract_sha256": sha256_from(f"{image}.sha256"),
              "image_download_size": os.path.getsize(f"{image}.xz"),
              "image_download_sha256": sha256_from(f"{image}.xz.sha256"),
              "release_date": datetime.date.today().isoformat(),
              "init_format": env_vars.get("INIT_FORMAT", "none"),
              "devices": rpi_json.get("devices", []),
          }

          manifest = {"os_list": [entry]}
          with open(f"{image}.rpi-imager.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          print(json.dumps(manifest, indent=2))

          # helper to rewrite the url to a local file:// path after download
          import shutil
          shutil.copy(os.path.join(os.environ["GITHUB_WORKSPACE"], "tools", "create-local-manifest.py"), "create-local-manifest.py")
        env:
          RPI_JSON: ${{ toJson(matrix.rpi_json) }}
          MATRIX_ENV: ${{ toJson(matrix.env) }}

      - name: "📋 Upload Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE }}-artifacts
          path: |
            build/${{ env.IMAGE }}.xz
            build/${{ env.IMAGE }}.xz.sha256
            build/${{ env.IMAGE }}.sha256
            build/${{ env.IMAGE }}.rpi-imager.json
            build/create-local-manifest.py
          if-no-files-found: ignore

      - name: "🚀 Upload to Release"
        if: ${{ inputs.upload_to_release }}
        working-directory: ./build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" --clobber \
            "${{ env.IMAGE }}.xz" \
            "${{ env.IMAGE }}.xz.sha256" \
            "${{ env.IMAGE }}.sha256" \
            "${{ env.IMAGE }}.rpi-imager.json"
