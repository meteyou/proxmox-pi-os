# Proxmox OS cloud-init overrides
#
# cloud-init is only used for the first-boot customisation written by the
# Raspberry Pi Imager (hostname, user, password, SSH keys, locale, timezone).
# After the first boot it is disabled by proxmox-os-firstboot.service.

# Proxmox needs the hostname to resolve to the real IP of the bridge instead
# of 127.0.1.1, otherwise pve-cluster refuses to start. /etc/hosts is therefore
# managed by proxmox-os-hosts.service on every boot and must not be touched
# by cloud-init.
manage_etc_hosts: false

# The network is a static ifupdown2 configuration (bridge on the wired port).
# NetworkManager has been removed from this image, so cloud-init must not
# render any network configuration. WiFi settings from the Imager are ignored.
network:
  config: disabled
