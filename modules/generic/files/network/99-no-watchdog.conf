# Proxmox OS
#
# Raspberry Pi OS enables the systemd runtime watchdog via
# /usr/lib/systemd/system.conf.d/40-rpi-enable-watchdog.conf. systemd then
# holds the hardware watchdog device and Proxmox' own watchdog-mux fails with
# "watchdog open: Device or resource busy". Hand the watchdog over to Proxmox.
[Manager]
RuntimeWatchdogSec=0
